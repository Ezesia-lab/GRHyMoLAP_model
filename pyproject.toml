[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grhymolap"
version = "0.1.0"
description = "GRHyMoLAP: a lightweight, calibratable rainfall-runoff model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GRHyMoLAP contributors" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "numba>=0.58",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/<your-org>/grhymolap"
Issues = "https://github.com/<your-org>/grhymolap/issues"

[tool.setuptools.packages.find]
where = ["src"]
